name: Atualizar Playlist M3U (6 em 6 horas)

on:
  schedule:
    - cron: '0 */6 * * *' # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: # Permite que você execute manualmente pela aba "Actions"

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Scraper e Atualizador
        run: python scraper.py
        env:
          # Você pode definir SOURCE_URL nas Secrets do repositório se desejar
          SOURCE_URL: ${{ secrets.SOURCE_URL || 'https://gauchazh.clicrbs.com.br/' }}

      - name: Commit e Push das alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels_db.json playlist.m3u
          git diff --staged --quiet || git commit -m "chore: atualização automática da playlist M3U"
          git push