name: Atualizar Playlist M3U (6 em 6 horas)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias do sistema (Correcao Ubuntu recente)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 || true

      - name: Instalar navegador Chromium
        run: |
          playwright install chromium
          # Tenta instalar as deps oficiais, mas ignora erro se algum pacote tiver nome diferente
          playwright install-deps chromium || true

      - name: Executar Scraper
        run: python scraper.py
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL || 'https://gauchazh.clicrbs.com.br/' }}

      - name: Commit e Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels_db.json playlist.m3u
          git diff --staged --quiet || git commit -m "chore: atualizacao automatica da playlist M3U"
          git push